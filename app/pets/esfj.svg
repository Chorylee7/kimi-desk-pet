<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- 甜甜班长 · ESFJ:玫瑰粉 + 头顶小花 + 挥手 -->
  <!-- 小花(蹭 .antenna 摆动) -->
  <g class="antenna">
    <rect x="95" y="15" width="10" height="10" fill="#F97316"/>
    <rect x="95" y="5" width="10" height="10" fill="#FFD93D"/>
    <rect x="85" y="15" width="10" height="10" fill="#FFD93D"/>
    <rect x="105" y="15" width="10" height="10" fill="#FFD93D"/>
    <rect x="95" y="25" width="10" height="10" fill="#FFD93D"/>
  </g>

  <!-- 身体 -->
  <rect x="70" y="70" width="60" height="10" fill="#F497B5"/>
  <rect x="60" y="80" width="80" height="10" fill="#F497B5"/>
  <rect x="50" y="90" width="100" height="70" fill="#F497B5"/>
  <rect x="60" y="160" width="80" height="10" fill="#F497B5"/>
  <rect x="70" y="170" width="60" height="10" fill="#F497B5"/>
  <rect x="140" y="90" width="10" height="70" fill="#E2779B"/>
  <rect x="130" y="160" width="10" height="10" fill="#E2779B"/>

  <!-- 眯眯笑眼(蹭 .eye 眨眼) -->
  <g class="eye eye-l" fill="#7A2E4D">
    <rect x="60" y="92" width="10" height="10"/>
    <rect x="70" y="84" width="10" height="10"/>
    <rect x="80" y="92" width="10" height="10"/>
  </g>
  <g class="eye eye-r" fill="#7A2E4D">
    <rect x="110" y="92" width="10" height="10"/>
    <rect x="120" y="84" width="10" height="10"/>
    <rect x="130" y="92" width="10" height="10"/>
  </g>

  <!-- 甜笑 -->
  <rect x="82" y="120" width="36" height="12" fill="#7A2E4D"/>
  <rect x="82" y="120" width="36" height="5" fill="#FFFFFF"/>

  <!-- 腮红 -->
  <rect x="55" y="110" width="15" height="10" fill="#F472B6" opacity="0.8"/>
  <rect x="130" y="110" width="15" height="10" fill="#F472B6" opacity="0.8"/>

  <!-- 挥手 -->
  <rect x="150" y="96" width="12" height="12" fill="#F497B5"/>
  <rect x="166" y="88" width="4" height="14" fill="#D1D5DB"/>
  <rect x="174" y="80" width="4" height="14" fill="#D1D5DB"/>
</svg>
