<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- 闪光爱豆 · ESFP:亮黄 + 头顶灯球 + 星星眼 + 开怀笑 -->
  <!-- 灯球(蹭 .antenna 摆动) -->
  <g class="antenna">
    <rect x="90" y="10" width="20" height="20" fill="#E5E7EB"/>
    <rect x="98" y="10" width="4" height="20" fill="#9CA3AF"/>
    <rect x="90" y="18" width="20" height="4" fill="#9CA3AF"/>
    <rect x="75" y="6" width="8" height="8" fill="#FDE047"/>
    <rect x="118" y="16" width="8" height="8" fill="#F472B6"/>
  </g>

  <!-- 漂浮彩纸 -->
  <rect x="30" y="70" width="8" height="8" fill="#F472B6"/>
  <rect x="164" y="88" width="8" height="8" fill="#34D399"/>
  <rect x="36" y="150" width="8" height="8" fill="#60A5FA"/>

  <!-- 身体 -->
  <rect x="70" y="70" width="60" height="10" fill="#FFCF4D"/>
  <rect x="60" y="80" width="80" height="10" fill="#FFCF4D"/>
  <rect x="50" y="90" width="100" height="70" fill="#FFCF4D"/>
  <rect x="60" y="160" width="80" height="10" fill="#FFCF4D"/>
  <rect x="70" y="170" width="60" height="10" fill="#FFCF4D"/>
  <rect x="140" y="90" width="10" height="70" fill="#F0B429"/>
  <rect x="130" y="160" width="10" height="10" fill="#F0B429"/>

  <!-- 星星眼(蹭 .eye 眨眼) -->
  <g class="eye eye-l">
    <rect x="60" y="90" width="22" height="22" fill="#5B3A0E"/>
    <rect x="63" y="93" width="8" height="8" fill="#FFFFFF"/>
    <rect x="72" y="103" width="5" height="5" fill="#FDE9B8"/>
  </g>
  <g class="eye eye-r">
    <rect x="118" y="90" width="22" height="22" fill="#5B3A0E"/>
    <rect x="121" y="93" width="8" height="8" fill="#FFFFFF"/>
    <rect x="130" y="103" width="5" height="5" fill="#FDE9B8"/>
  </g>

  <!-- 开怀笑 -->
  <rect x="70" y="126" width="60" height="20" fill="#7A2E1D"/>
  <rect x="70" y="126" width="60" height="9" fill="#FFFFFF"/>
  <rect x="85" y="138" width="30" height="8" fill="#F87171"/>

  <!-- 腮红 -->
  <rect x="50" y="114" width="16" height="10" fill="#F97316" opacity="0.55"/>
  <rect x="134" y="114" width="16" height="10" fill="#F97316" opacity="0.55"/>
</svg>
