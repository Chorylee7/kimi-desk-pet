<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- 扳手游侠 · ISTP:蓝灰工装 + 护目镜推额头 + 手持扳手 -->
  <!-- 护目镜(推在额头,蹭 .antenna 摆动) -->
  <g class="antenna">
    <rect x="55" y="62" width="90" height="6" fill="#374151"/>
    <rect x="70" y="50" width="22" height="14" fill="#374151"/>
    <rect x="74" y="53" width="14" height="8" fill="#93C5FD"/>
    <rect x="108" y="50" width="22" height="14" fill="#374151"/>
    <rect x="112" y="53" width="14" height="8" fill="#93C5FD"/>
  </g>

  <!-- 身体 -->
  <rect x="70" y="70" width="60" height="10" fill="#6B7B8C"/>
  <rect x="60" y="80" width="80" height="10" fill="#6B7B8C"/>
  <rect x="50" y="90" width="100" height="70" fill="#6B7B8C"/>
  <rect x="60" y="160" width="80" height="10" fill="#6B7B8C"/>
  <rect x="70" y="170" width="60" height="10" fill="#6B7B8C"/>
  <rect x="140" y="90" width="10" height="70" fill="#4F5F70"/>
  <rect x="130" y="160" width="10" height="10" fill="#4F5F70"/>

  <!-- 冷静半阖眼(蹭 .eye 眨眼) -->
  <g class="eye eye-l"><rect x="62" y="100" width="24" height="8" fill="#1F2933"/></g>
  <g class="eye eye-r"><rect x="114" y="100" width="24" height="8" fill="#1F2933"/></g>

  <!-- 淡定嘴角 -->
  <rect x="90" y="130" width="24" height="7" fill="#1F2933"/>
  <rect x="110" y="124" width="7" height="7" fill="#1F2933"/>

  <!-- 工装背带 -->
  <rect x="70" y="140" width="12" height="30" fill="#374151"/>
  <rect x="118" y="140" width="12" height="30" fill="#374151"/>

  <!-- 手持扳手 -->
  <rect x="152" y="112" width="8" height="38" fill="#9AA5B1"/>
  <rect x="144" y="100" width="24" height="14" fill="#C0C8D0"/>
  <rect x="152" y="100" width="9" height="6" fill="#6B7B8C"/>
</svg>
