<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- 暖灯管家 · ISFJ:头顶小暖灯 + 围裙 + 热茶 -->
  <!-- 小暖灯(蹭 .antenna 摆动) -->
  <g class="antenna">
    <rect x="95" y="10" width="10" height="20" fill="#8A6B4A"/>
    <rect x="80" y="30" width="40" height="10" fill="#F4A259"/>
    <rect x="70" y="40" width="60" height="10" fill="#F4A259"/>
    <rect x="90" y="50" width="20" height="10" fill="#FFD166"/>
    <rect x="80" y="50" width="10" height="10" fill="#FFD166" opacity="0.5"/>
    <rect x="110" y="50" width="10" height="10" fill="#FFD166" opacity="0.5"/>
  </g>

  <!-- 身体 -->
  <rect x="70" y="60" width="60" height="10" fill="#E3B77E"/>
  <rect x="60" y="70" width="80" height="10" fill="#E3B77E"/>
  <rect x="50" y="80" width="100" height="90" fill="#E3B77E"/>
  <rect x="60" y="170" width="80" height="10" fill="#E3B77E"/>
  <rect x="140" y="80" width="10" height="90" fill="#C99B62"/>
  <rect x="130" y="170" width="10" height="10" fill="#C99B62"/>
  <rect x="40" y="90" width="10" height="10" fill="#E3B77E"/>
  <rect x="150" y="90" width="10" height="10" fill="#E3B77E"/>

  <!-- 眯眯笑眼(蹭 .eye 眨眼) -->
  <g class="eye eye-l" fill="#6B4A32">
    <rect x="60" y="90" width="10" height="10"/>
    <rect x="70" y="80" width="10" height="10"/>
    <rect x="80" y="90" width="10" height="10"/>
  </g>
  <g class="eye eye-r" fill="#6B4A32">
    <rect x="110" y="90" width="10" height="10"/>
    <rect x="120" y="80" width="10" height="10"/>
    <rect x="130" y="90" width="10" height="10"/>
  </g>

  <!-- 微笑与腮红 -->
  <rect x="90" y="100" width="20" height="10" fill="#6B4A32"/>
  <rect x="50" y="110" width="10" height="10" fill="#F2A9A2" opacity="0.8"/>
  <rect x="140" y="110" width="10" height="10" fill="#F2A9A2" opacity="0.8"/>

  <!-- 围裙 -->
  <rect x="80" y="110" width="10" height="20" fill="#FBF6EC"/>
  <rect x="110" y="110" width="10" height="20" fill="#FBF6EC"/>
  <rect x="70" y="130" width="60" height="50" fill="#FBF6EC"/>
  <rect x="85" y="150" width="30" height="20" fill="#EFE6D2"/>

  <!-- 热茶 -->
  <rect x="140" y="130" width="20" height="20" fill="#FFFFFF"/>
  <rect x="140" y="130" width="20" height="5" fill="#B5651D"/>
  <rect x="158" y="136" width="10" height="8" fill="#FFFFFF"/>
  <rect x="140" y="110" width="10" height="10" fill="#E8E8E8" opacity="0.8"/>
  <rect x="150" y="100" width="10" height="10" fill="#E8E8E8" opacity="0.6"/>
</svg>
