<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- 夜幕军师 · INTJ:深紫蓝斗篷 + 棋盘格围巾 + 悬空小星 -->
  <!-- 悬空小星(蹭 .antenna 摆动) -->
  <g class="antenna" fill="#FFD166">
    <rect x="90" y="10" width="20" height="10"/>
    <rect x="70" y="20" width="60" height="10"/>
    <rect x="90" y="30" width="20" height="10"/>
  </g>

  <!-- 斗篷下摆 -->
  <rect x="50" y="120" width="100" height="20" fill="#3A2D5C"/>
  <rect x="40" y="140" width="120" height="40" fill="#3A2D5C"/>
  <rect x="130" y="120" width="20" height="20" fill="#2C2147"/>
  <rect x="140" y="140" width="20" height="40" fill="#2C2147"/>

  <!-- 兜帽 -->
  <rect x="70" y="40" width="60" height="10" fill="#3A2D5C"/>
  <rect x="60" y="50" width="80" height="10" fill="#3A2D5C"/>
  <rect x="50" y="60" width="100" height="50" fill="#3A2D5C"/>
  <rect x="50" y="50" width="10" height="60" fill="#55418A"/>
  <rect x="140" y="60" width="10" height="50" fill="#2C2147"/>

  <!-- 脸 -->
  <rect x="70" y="60" width="60" height="40" fill="#EFE7FA"/>

  <!-- 锐利斜眼(蹭 .eye 眨眼) -->
  <g class="eye eye-l">
    <rect x="70" y="70" width="10" height="10" fill="#241A3A"/>
    <rect x="80" y="80" width="10" height="10" fill="#241A3A"/>
    <rect x="80" y="70" width="10" height="10" fill="#B79CFF"/>
  </g>
  <g class="eye eye-r">
    <rect x="120" y="70" width="10" height="10" fill="#241A3A"/>
    <rect x="110" y="80" width="10" height="10" fill="#241A3A"/>
    <rect x="110" y="70" width="10" height="10" fill="#B79CFF"/>
  </g>

  <!-- 棋盘格围巾 -->
  <g>
    <rect x="60" y="100" width="10" height="10" fill="#7C5CBF"/>
    <rect x="80" y="100" width="10" height="10" fill="#7C5CBF"/>
    <rect x="100" y="100" width="10" height="10" fill="#7C5CBF"/>
    <rect x="120" y="100" width="10" height="10" fill="#7C5CBF"/>
    <rect x="70" y="100" width="10" height="10" fill="#4A3580"/>
    <rect x="90" y="100" width="10" height="10" fill="#4A3580"/>
    <rect x="110" y="100" width="10" height="10" fill="#4A3580"/>
    <rect x="130" y="100" width="10" height="10" fill="#4A3580"/>
    <rect x="70" y="110" width="10" height="10" fill="#7C5CBF"/>
    <rect x="90" y="110" width="10" height="10" fill="#7C5CBF"/>
    <rect x="110" y="110" width="10" height="10" fill="#7C5CBF"/>
    <rect x="130" y="110" width="10" height="10" fill="#7C5CBF"/>
    <rect x="60" y="110" width="10" height="10" fill="#4A3580"/>
    <rect x="80" y="110" width="10" height="10" fill="#4A3580"/>
    <rect x="100" y="110" width="10" height="10" fill="#4A3580"/>
    <rect x="120" y="110" width="10" height="10" fill="#4A3580"/>
  </g>

  <!-- 领口宝石 -->
  <rect x="90" y="120" width="20" height="10" fill="#B79CFF"/>
</svg>
