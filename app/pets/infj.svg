<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- 星灯隐士 · INFJ:青绿斗篷 + 手提小灯笼 + 头顶微光 -->
  <!-- 微光(蹭 .antenna 摆动) -->
  <g class="antenna" fill="#A7E3C0">
    <rect x="95" y="10" width="10" height="10"/>
    <rect x="85" y="20" width="30" height="10"/>
    <rect x="95" y="30" width="10" height="10"/>
  </g>

  <!-- 斗篷下摆 -->
  <rect x="50" y="120" width="100" height="20" fill="#2F6B5E"/>
  <rect x="40" y="140" width="120" height="40" fill="#2F6B5E"/>
  <rect x="130" y="120" width="20" height="20" fill="#235448"/>
  <rect x="140" y="140" width="20" height="40" fill="#235448"/>

  <!-- 兜帽 -->
  <rect x="70" y="40" width="60" height="10" fill="#2F6B5E"/>
  <rect x="60" y="50" width="80" height="10" fill="#2F6B5E"/>
  <rect x="50" y="60" width="100" height="50" fill="#2F6B5E"/>
  <rect x="50" y="50" width="10" height="60" fill="#4A8A7A"/>
  <rect x="140" y="60" width="10" height="50" fill="#235448"/>

  <!-- 脸 -->
  <rect x="70" y="60" width="60" height="40" fill="#F2EDE4"/>

  <!-- 温柔垂眼(蹭 .eye 眨眼) -->
  <g class="eye eye-l" fill="#3D5A50">
    <rect x="70" y="78" width="10" height="10"/>
    <rect x="80" y="70" width="10" height="10"/>
    <rect x="90" y="78" width="10" height="10"/>
  </g>
  <g class="eye eye-r" fill="#3D5A50">
    <rect x="110" y="78" width="10" height="10"/>
    <rect x="120" y="70" width="10" height="10"/>
    <rect x="130" y="78" width="10" height="10"/>
  </g>
  <!-- 浅笑 -->
  <rect x="95" y="92" width="10" height="6" fill="#3D5A50"/>

  <!-- 手提灯笼 -->
  <rect x="138" y="112" width="14" height="8" fill="#8B5E3C"/>
  <rect x="132" y="120" width="26" height="30" fill="#8B5E3C"/>
  <rect x="136" y="124" width="18" height="22" fill="#F6C453"/>
  <rect x="141" y="129" width="8" height="12" fill="#FDE9B8"/>
</svg>
