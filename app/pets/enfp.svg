<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- 彩虹弹弹 · ENFP:亮粉 + 彩虹发带 + 星星眼 -->
  <!-- 彩虹发带(蹭 .antenna 摆动) -->
  <g class="antenna">
    <rect x="70" y="52" width="12" height="12" fill="#F87171"/>
    <rect x="82" y="52" width="12" height="12" fill="#FBBF24"/>
    <rect x="94" y="52" width="12" height="12" fill="#34D399"/>
    <rect x="106" y="52" width="12" height="12" fill="#60A5FA"/>
    <rect x="118" y="52" width="12" height="12" fill="#A78BFA"/>
  </g>

  <!-- 漂浮的闪光 -->
  <rect x="28" y="78" width="10" height="10" fill="#FDE047"/>
  <rect x="162" y="98" width="10" height="10" fill="#6EE7B7"/>

  <!-- 身体 -->
  <rect x="70" y="70" width="60" height="10" fill="#FBCFE8"/>
  <rect x="60" y="80" width="80" height="10" fill="#FBCFE8"/>
  <rect x="50" y="90" width="100" height="70" fill="#FBCFE8"/>
  <rect x="60" y="160" width="80" height="10" fill="#FBCFE8"/>
  <rect x="70" y="170" width="60" height="10" fill="#FBCFE8"/>
  <rect x="140" y="90" width="10" height="70" fill="#F5A8C8"/>
  <rect x="130" y="160" width="10" height="10" fill="#F5A8C8"/>

  <!-- 星星眼(蹭 .eye 眨眼) -->
  <g class="eye eye-l">
    <rect x="60" y="90" width="22" height="22" fill="#831843"/>
    <rect x="62" y="92" width="8" height="8" fill="#FFFFFF"/>
    <rect x="72" y="102" width="5" height="5" fill="#FFD6E8"/>
  </g>
  <g class="eye eye-r">
    <rect x="118" y="90" width="22" height="22" fill="#831843"/>
    <rect x="120" y="92" width="8" height="8" fill="#FFFFFF"/>
    <rect x="130" y="102" width="5" height="5" fill="#FFD6E8"/>
  </g>

  <!-- 大嘴笑 -->
  <rect x="70" y="126" width="60" height="20" fill="#831843"/>
  <rect x="70" y="126" width="60" height="9" fill="#FFFFFF"/>

  <!-- 腮红 -->
  <rect x="50" y="114" width="18" height="10" fill="#F472B6" opacity="0.8"/>
  <rect x="132" y="114" width="18" height="10" fill="#F472B6" opacity="0.8"/>
</svg>
