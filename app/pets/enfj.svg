<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- 篝火团长 · ENFJ:暖橙 + 头顶小太阳 + 开怀大笑 -->
  <!-- 小太阳(蹭 .antenna 摆动) -->
  <g class="antenna" fill="#FFD93D">
    <rect x="90" y="12" width="20" height="20"/>
    <rect x="75" y="17" width="10" height="10"/>
    <rect x="115" y="17" width="10" height="10"/>
    <rect x="95" y="0" width="10" height="8"/>
    <rect x="95" y="36" width="10" height="8"/>
  </g>

  <!-- 身体 -->
  <rect x="70" y="70" width="60" height="10" fill="#F8B26A"/>
  <rect x="60" y="80" width="80" height="10" fill="#F8B26A"/>
  <rect x="50" y="90" width="100" height="70" fill="#F8B26A"/>
  <rect x="60" y="160" width="80" height="10" fill="#F8B26A"/>
  <rect x="70" y="170" width="60" height="10" fill="#F8B26A"/>
  <rect x="140" y="90" width="10" height="70" fill="#E08E45"/>
  <rect x="130" y="160" width="10" height="10" fill="#E08E45"/>

  <!-- 开心闭眼(蹭 .eye 眨眼) -->
  <g class="eye eye-l" fill="#5A3A1E">
    <rect x="60" y="92" width="10" height="10"/>
    <rect x="70" y="84" width="10" height="10"/>
    <rect x="80" y="92" width="10" height="10"/>
  </g>
  <g class="eye eye-r" fill="#5A3A1E">
    <rect x="110" y="92" width="10" height="10"/>
    <rect x="120" y="84" width="10" height="10"/>
    <rect x="130" y="92" width="10" height="10"/>
  </g>

  <!-- 大笑 -->
  <rect x="65" y="118" width="70" height="22" fill="#7C2D12"/>
  <rect x="65" y="118" width="70" height="10" fill="#FFFFFF"/>
  <rect x="90" y="118" width="8" height="10" fill="#7C2D12"/>
  <rect x="110" y="118" width="8" height="10" fill="#7C2D12"/>

  <!-- 腮红 -->
  <rect x="50" y="110" width="18" height="10" fill="#F97316" opacity="0.55"/>
  <rect x="132" y="110" width="18" height="10" fill="#F97316" opacity="0.55"/>
</svg>
