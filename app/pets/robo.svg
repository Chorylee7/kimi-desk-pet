<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6FAFE"/>
      <stop offset="1" stop-color="#C7D5E4"/>
    </linearGradient>
    <linearGradient id="rvisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2033"/>
      <stop offset="1" stop-color="#1C3D60"/>
    </linearGradient>
    <radialGradient id="rglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#54E0FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#54E0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 悬浮光晕 -->
  <ellipse cx="100" cy="178" rx="46" ry="10" fill="url(#rglow)"/>

  <!-- 天线（蹭 .antenna 摆动动画） -->
  <g class="antenna">
    <line x1="100" y1="34" x2="100" y2="14" stroke="#8FA3B8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="11" r="13" fill="url(#rglow)"/>
    <circle cx="100" cy="11" r="6" fill="#54E0FF"/>
  </g>

  <!-- 侧耳（发光耳机） -->
  <circle cx="34" cy="102" r="15" fill="#1E3248" stroke="#54E0FF" stroke-width="2.5" opacity="0.95"/>
  <circle cx="34" cy="102" r="5" fill="#54E0FF"/>
  <circle cx="166" cy="102" r="15" fill="#1E3248" stroke="#54E0FF" stroke-width="2.5" opacity="0.95"/>
  <circle cx="166" cy="102" r="5" fill="#54E0FF"/>

  <!-- 头 -->
  <rect x="44" y="38" width="112" height="112" rx="34" fill="url(#rbg)" stroke="#9FB2C6" stroke-width="3"/>
  <line x1="66" y1="56" x2="134" y2="56" stroke="#B9C7D6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <circle cx="60" cy="72" r="2.5" fill="#9FB2C6"/>
  <circle cx="140" cy="72" r="2.5" fill="#9FB2C6"/>

  <!-- 面罩 -->
  <rect x="56" y="76" width="88" height="42" rx="21" fill="url(#rvisor)" stroke="#2C4B6E" stroke-width="2"/>

  <!-- 眼睛（蹭 .eye 眨眼动画） -->
  <g class="eye eye-l">
    <ellipse cx="83" cy="97" rx="9.5" ry="12" fill="#54E0FF"/>
    <circle cx="86" cy="92" r="3" fill="#EAFBFF"/>
  </g>
  <g class="eye eye-r">
    <ellipse cx="117" cy="97" rx="9.5" ry="12" fill="#54E0FF"/>
    <circle cx="120" cy="92" r="3" fill="#EAFBFF"/>
  </g>

  <!-- LED 嘴 -->
  <path d="M84 134 Q100 143 116 134" fill="none" stroke="#54E0FF" stroke-width="4" stroke-linecap="round"/>
  <rect x="58" y="126" width="14" height="5" rx="2.5" fill="#54E0FF" opacity="0.45"/>
  <rect x="128" y="126" width="14" height="5" rx="2.5" fill="#54E0FF" opacity="0.45"/>
</svg>
