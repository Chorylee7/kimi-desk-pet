<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- 奇思博士 · INTP:乱发 + 方框眼镜 + 头顶悬浮问号 -->
  <!-- 悬浮问号(蹭 .antenna 摆动) -->
  <g class="antenna" fill="#F6C453">
    <rect x="90" y="5" width="30" height="10"/>
    <rect x="110" y="15" width="10" height="10"/>
    <rect x="100" y="25" width="10" height="10"/>
    <rect x="100" y="45" width="10" height="10"/>
  </g>

  <!-- 身体 -->
  <rect x="70" y="70" width="60" height="10" fill="#C9D4F2"/>
  <rect x="60" y="80" width="80" height="10" fill="#C9D4F2"/>
  <rect x="50" y="90" width="100" height="70" fill="#C9D4F2"/>
  <rect x="60" y="160" width="80" height="10" fill="#C9D4F2"/>
  <rect x="70" y="170" width="60" height="10" fill="#C9D4F2"/>
  <rect x="140" y="90" width="10" height="70" fill="#A3B1DC"/>
  <rect x="130" y="160" width="10" height="10" fill="#A3B1DC"/>

  <!-- 熬夜乱发 -->
  <rect x="60" y="60" width="10" height="10" fill="#4A5568"/>
  <rect x="80" y="52" width="10" height="18" fill="#4A5568"/>
  <rect x="100" y="58" width="10" height="12" fill="#4A5568"/>
  <rect x="120" y="52" width="10" height="18" fill="#4A5568"/>

  <!-- 方框眼镜 -->
  <g fill="#374151">
    <rect x="55" y="90" width="35" height="8"/>
    <rect x="55" y="118" width="35" height="8"/>
    <rect x="55" y="90" width="8" height="36"/>
    <rect x="82" y="90" width="8" height="36"/>
    <rect x="110" y="90" width="35" height="8"/>
    <rect x="110" y="118" width="35" height="8"/>
    <rect x="110" y="90" width="8" height="36"/>
    <rect x="137" y="90" width="8" height="36"/>
    <rect x="90" y="98" width="20" height="8"/>
  </g>

  <!-- 镜片后的眼睛(蹭 .eye 眨眼) -->
  <g class="eye eye-l"><rect x="66" y="102" width="12" height="12" fill="#1F2937"/></g>
  <g class="eye eye-r"><rect x="122" y="102" width="12" height="12" fill="#1F2937"/></g>

  <!-- 困倦抿嘴 -->
  <rect x="90" y="140" width="20" height="6" fill="#6B7280"/>
</svg>
